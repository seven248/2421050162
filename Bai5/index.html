<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 5</title>
    
    <style>
        /* Loại 2: Internal Style */ 
        h2{/*color dùng để quy định màu chữ*/
            color:red;
        }
        #tieuDe{
            color:orange;
        }
    </style>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <!-- I. Viết Style -->
    <!-- Kiểu 1 viết style trong thẻ--> 
     <!-- Kiểu 1: Inline Style -->
    <h1 style="color:blue">HUMG</h1>
    <!-- kiểu 2 viết ngoài thẻ-->
     <h2>Trường Đại học Mỏ-Địa chất</h2>

     <h3>Lớp phát triển ứng dụng Web</h3>

     <!-- II. Select -->
      <!-- Cách 1: Dùng thẻ tên -->

      <!-- Cách 2: Dùng id (Viết dấu # trước trên id)-->
       

       <!-- Cách 3: Dùng class (Viết dấu . trước tên class) -->
        <h2 id="tieuDe" class="tieuDe">Trường Đại học Mỏ-Địa chất</h2> 

        <!-- Cách 4: Dùng thuộc tính class -->
         <h3 class="tieuDe">Lớp Phát triển ứng dụng Web</h3>
    
</body>
</html>
