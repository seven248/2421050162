<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        // in ra màn hình
        document.writeln("Hello World! <br>")
        // khai báo biến
        var ten ="Đình Huy <br>"
        document.writeln(ten);
        ten ="Thu Hằng <br>"
        document.writeln(ten);
        var namNay = 2026;
        document.writeln(namNay);
        //Phép toán
            var soThuNhat =10;
            var soThuHai =5;
            var ketQua =0
             //Cộng +
             document.write("<br> Ket qua soThu1 + soThu2 la:");
             ketQua = soThuNhat + soThuHai;
             document.write(ketQua);
            //  Trừ -
            document.write("<br> Ket qua soThu1 - soThu2 la:");
             ketQua = soThuNhat - soThuHai;
             document.write(ketQua);
            //Nhân *
            document.write("<br> Ket qua soThu1 * soThu2 la:");
             ketQua = soThuNhat * soThuHai;
             document.write(ketQua);
            //Chia /
            document.write("<br> Ket qua soThu1 / soThu2 la:");
             ketQua = soThuNhat / soThuHai;
             document.write(ketQua);
            //Chia lấy dư %
            document.writeln("<br> Ket qua soThu1 % soThu2 la:")
             ketQua = soThuNhat % soThuHai;
             document.write(ketQua);

            //++
             document.writeln("<br>");
             soThuNhat++;
             document.write(soThuNhat++);
             document.writeln("<br>");
             document.write(soThuNhat);
            //--
             document.writeln("<br>");
             document.writeln(--soThuHai);

             document.writeln("<br>");
             soThuNhat += soThuHai;
             document.writeln(soThuNhat);

            //-=
             document.writeln("<br>");
             soThuNhat -= soThuHai;
             document.writeln(soThuNhat);

             
             var ho = "Trần Thị";
             document.writeln("<br>" + ho + " " + ten);
             document.writeln("<br>");
            //Đo độ dài của chuỗi
             document.writeln(ho.length);
            //Kiểm tra kiểu dữ liệu của biến
             document.writeln(typeof(ho));

            //
             document.writeln("<br>");
             var hoVaTen ="Nguyễn Đình Huy";
             document.writeln(hoVaTen.indexOf("u"));

             document.writeln("<br>");
             document.writeln(hoVaTen.includes("H"));

             document.writeln("<br>");
             document.writeln(hoVaTen.startsWith("Nguyễn"));

             document.writeln("<br>");
             document.writeln(hoVaTen.replace("Nguyễn","Trần"));

             document.writeln("<br>");
             document.writeln(hoVaTen.toUpperCase());

             document.writeln("<br>");
             document.writeln(hoVaTen.toLocaleLowerCase());
            
            //Date
             var homNay = new Date();
             document.writeln("<br>" + homNay);

             var  ngay = new Date("08/05/2025");
             document.writeln("<br>" + ngay);

             var namNay = homNay.getFullYear();
             document.writeln("<br>" + namNay);

             var thangNay = homNay.getMonth() +1;
             document.writeln("<br>" + thangNay);

             var ngayNay = homNay.getDate();
             document.writeln("<br>" + ngayNay);

             var thu = homNay.getDay() +1;
             document.writeln("<br>" + thu);

             document.writeln("<br>" + "Hôm nay là thứ " + thu + " ngày " + ngayNay + " tháng " + thangNay + " năm " + namNay);

            //Mảng
             var mangSo = [1, 2, 3, 4, 5];
             document.writeln("<br>");
             document.writeln(mangSo[2]);
             document.writeln("<br>" + mangSo.length);

             var mangTen = ["Huy", "Hằng", "Huyền"];
             document.writeln("<br>" + mangTen[2]);

             var mang = [1, 2, 3, 4, "Huy", "Hằng", "Huyền"];
             document.writeln("<br>" + mang[5]);

             var d = mang.concat(mangSo, mangTen);
            //
             document.writeln("<br>" + d);
            //Thêm kí tự vào giữa các thành phần chuỗi
             document.writeln("<br>" + d.join("-"));
            //
             document.writeln("<br>" + d.pop());
            //Thêm thành phần vào mảng
             d.push("Sứa");
             document.writeln("<br>" + d);
             document.writeln("<br>" + mangSo.reverse());
            //Object
             var thongTinSinhVien = {
                hoTen: "Nguyễn Đình Huy",
                namSinh: 2006,
                queQuan: {
                    xaPhuong: "Lai Khê",
                    thanhPho: "Hải Phòng",
                }
             };

             document.writeln("<br>" + thongTinSinhVien.hoTen);
             document.writeln("<br>" + thongTinSinhVien.queQuan.thanhPho);
             tuoi = namNay - thongTinSinhVien.namSinh;
             document.writeln("<br>" + tuoi);
             thongTinSinhVien.tuoi = tuoi;
             console.log(thongTinSinhVien);
             //boolean: true nam/ false nữ
             thongTinSinhVien.gioiTinh = true;

             var mangThongTin = [
                {
                    hoTen: "Trần Thị Thu Hằng",
                    namSinh: 2006,
                    queQuan:{
                        xaPhuong: "Nghĩa Lâm",
                        tinhThanhPho: "Ninh Bình",
                    }
                }
                
             ]

            //== =! > <
            //=== so sánh cả giá trị và kiểu dữ liệu
             var so1 = 5;
             var so2 = 10;
             document.writeln("<br>");
             document.writeln(so1 == so2);
            //&& ||
             document.writeln("<br>");
             if(thu >= 7 ){
                document.writeln("Cuối tuần");
             }
             
             else{
                document.writeln("Đi học");
             }
             document.writeln("<br>");

             //Kiểm tra số chẵn lẻ
             var so = 24;
             if(so % 2 == 0 ){
                document.writeln(so + " là số chẵn");
             }else{
                document.writeln(so + " là số lẽ");
             }


            

             

    </script>
    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
