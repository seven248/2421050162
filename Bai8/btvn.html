<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-2</title>
</head>

<body>
    <script>
  
    function diemChu(a, b, c) {
        var tong = a * 0.6 + b * 0.3 + c * 0.1;
        var chu;

        if (tong >= 9) {
            chu = "A+";
        } else if (tong >= 8.5) {
            chu = "A";
        } else if (tong >= 8) {
            chu = "B+";
        } else if (tong >= 7) {
            chu = "B";
        } else if (tong >= 6.5) {
            chu = "C+";
        } else if (tong >= 5.5) {
            chu = "C";
        } else if (tong >= 5) {
            chu = "D+";
        } else if (tong >= 4) {
            chu = "D";
        } else {
            chu = "F";
        }

        return "Điểm tổng: " + tong.toFixed(2) + " → Điểm chữ: " + chu;
    }

    var a = Number(prompt("Nhập điểm A", "Nhập số ở đây"));
    var b = Number(prompt("Nhập điểm B", "Nhập số ở đây"));
    var c = Number(prompt("Nhập điểm C", "Nhập số ở đây"));
    alert(diemChu(a, b, c));
</script>
</script>

</body>

</html>
