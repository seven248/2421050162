<html>
    <head>
        <title>Bai1 html</title>
    </head>
    <body>
        Môn Phát triển ứng dụng Web + BTL

        <!-- Để chú thích dùng 2 cách
        Cách 1: ctrl + K + C
        Cách 2: Ctrl + /
        Đây là chú thích -->

        <p>Thẻ p là thẻ phân đoạn</p>

        <!-- Thẻ h là thẻ định dạng đề mục -->
        <h1>Thẻ H1</h1>
        <h2>Thẻ H2</h2>
        <h3>Thẻ H3</h3>

        <!-- Thẻ br là thẻ xuống dòng  -->
        <p>Môn Web <br>Nhóm 03</p>

        <!-- Thẻ div và span để phân chia đoạn -->
         <div>Đây là thẻ div</div>
        <span>Đây là thẻ span</span><br>

        <!-- Thẻ b: viết chữ đậm
        Thẻ i: viết chữ nghiêng
        Thẻ u: viết chữ gạch chân -->
        <b>b</b><br>
        <i>i</i><br>
        <u>u</u><br>

        <div>
            <font face="Arial">Môn phát triển ứng dụng Web + BTL</font>
            <font color="pink">Nhóm 03</font>
            <font size="36">Tiết 1 2 </font>
        </div>
        <div>
            <font face="Arial" color="blue" size="15">Nguyễn Đình Huy</font>
        </div>
    </body>
</html>
